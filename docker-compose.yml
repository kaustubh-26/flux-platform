secrets:
  valkey_pass:
    file: ./secrets/valkey_pass.txt
  weather_api_key:
    file: ./secrets/weather_api_key.txt
  newsdata_api_key:
    file: ./secrets/newsdata_api_key.txt
  finnhub_api_key:
    file: ./secrets/finnhub_api_key.txt

services:
  # -------------------------------------------------
  # Kafka (KRaft mode, single node — no Zookeeper needed)
  # Custom-built on eclipse-temurin:17-jre-jammy (arm/v7 compatible).
  # Build context is ./kafka — see Dockerfile/entrypoint.sh/server.properties there.
  # -------------------------------------------------
  kafka:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # Critical on a 1GB node: Kafka's default heap is 1GB on its own.
      KAFKA_HEAP_OPTS: "-Xms160m -Xmx160m"
      # The node's LAN IP — this is what other machines on your network
      # will connect to on port 9094.
      KAFKA_EXTERNAL_HOST: ${KAFKA_EXTERNAL_HOST:-192.168.1.109}
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # -------------------------------------------------
  # Valkey Caching Layer
  # -------------------------------------------------
  valkey:
    image: valkey/valkey:7.2.8
    container_name: valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    mem_limit: 64m
    secrets:
      - valkey_pass
    command: >
      sh -c "valkey-server --requirepass \"$$(cat /run/secrets/valkey_pass)\" --appendonly yes --appendfilename appendonly.aof --appendfsync everysec --no-appendfsync-on-rewrite yes --save 900 1 --save 300 10 --save 60 10000 --maxmemory 48mb --maxmemory-policy allkeys-lru --notify-keyspace-events Ex --lazyfree-lazy-eviction yes --lazyfree-lazy-expire yes --lazyfree-lazy-server-del yes"

  # -------------------------------------------------
  # Application Microservices
  # -------------------------------------------------
  weather-service:
    image: local/weather-service:latest
    pull_policy: never
    container_name: weather-service
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    depends_on:
      kafka:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped
    mem_limit: 64m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=48"
      KAFKA_BROKER_ADDRESS: kafka:9092
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_pass
      WEATHER_API_KEY: /run/secrets/weather_api_key
    secrets:
      - valkey_pass
      - weather_api_key

  crypto-service:
    image: local/crypto-service:latest
    pull_policy: never
    container_name: crypto-service
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    depends_on:
      kafka:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped
    mem_limit: 64m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=48"
      KAFKA_BROKER_ADDRESS: kafka:9092
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_pass
      TICKER_FLUSH_INTERVAL_MS: 2000
    secrets:
      - valkey_pass

  stock-service:
    image: local/stock-service:latest
    pull_policy: never
    container_name: stock-service
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    depends_on:
      kafka:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped
    mem_limit: 64m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=48"
      KAFKA_BROKER_ADDRESS: kafka:9092
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_pass
      FINNHUB_API_KEY: /run/secrets/finnhub_api_key
    secrets:
      - valkey_pass
      - finnhub_api_key

  news-service:
    image: local/news-service:latest
    pull_policy: never
    container_name: news-service
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    depends_on:
      kafka:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped
    mem_limit: 64m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=48"
      KAFKA_BROKER_ADDRESS: kafka:9092
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_pass
      NEWSDATA_API_KEY: /run/secrets/newsdata_api_key
    secrets:
      - valkey_pass
      - newsdata_api_key

  
  # -------------------------------------------------
  # Auth Service
  # -------------------------------------------------
  auth:
    image: local/auth-service:latest
    pull_policy: never
    container_name: auth
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    env_file:
      - ./services/auth-service/.env
    restart: unless-stopped

  # -------------------------------------------------
  # Server Engine / Gateway BFF
  # -------------------------------------------------
  server:
    image: local/server:latest
    pull_policy: never
    container_name: server
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      kafka:
        condition: service_healthy
      valkey:
        condition: service_started
      weather-service:
        condition: service_started
      crypto-service:
        condition: service_started
      stock-service:
        condition: service_started
      news-service:
        condition: service_started
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=96"
      KAFKA_BROKER_ADDRESS: kafka:9092
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_pass
      FRONTEND_URL: ${FRONTEND_URL:-http://nginx:80}
      SERVER_PORT: 3000
    secrets:
      - valkey_pass

  # -------------------------------------------------
  # Web Frontend & Reverse Proxy
  # -------------------------------------------------
  frontend:
    image: local/frontend:latest
    pull_policy: never
    container_name: frontend
    mem_limit: 32m
    depends_on:
      - server
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    mem_limit: 16m
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - server
    restart: unless-stopped

volumes:
  kafka-data:
  valkey-data:
