# Single-node KRaft config, tuned for a resource-constrained device
# (Raspberry Pi 2: quad-core Cortex-A7 @ 900MHz, 1GB RAM shared with
# valkey + microservices + server + frontend + nginx)

process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093

# PLAINTEXT: for other containers on the compose network (kafka:9092)
# EXTERNAL:  for clients on the LAN, reached via the network IP
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://EXTERNAL_HOST_PLACEHOLDER:9094
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

log.dirs=/var/lib/kafka/data

# Fewer threads — this CPU only has 4 weak cores, shared with everything else
num.network.threads=2
num.io.threads=2
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

auto.create.topics.enable=true
num.partitions=1
default.replication.factor=1
# Single partition for consumer offsets (reduces 50 partitions down to 1)
offsets.topic.num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Micro-retention: Keep only ~10-15 minutes of data
log.retention.minutes=15
log.retention.check.interval.ms=60000

# Roll segments frequently so old records actually get deleted
log.segment.bytes=1048576
log.roll.minutes=10

num.recovery.threads.per.data.dir=1

# Disable compaction (too heavy for Pi 2)
log.cleaner.enable=false