name: Build and Push Changed Docker Images

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [ main ]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 2

      # 1. Detect which service folders changed in this push
      - name: Check for changed services
        uses: dorny/paths-filter@v3
        id: changes
        with:
          base: HEAD~1
          ref: HEAD
          filters: |
            weather:
              - 'services/weather-service/**'
              - 'package.json'
            crypto:
              - 'services/crypto-service/**'
              - 'package.json'
            stock:
              - 'services/stock-service/**'
              - 'package.json'
            news:
              - 'services/news-service/**'
              - 'package.json'
            auth:
              - 'services/auth-service/**'
              - 'package.json'
            server:
              - 'server/**'
              - 'package.json'
            frontend:
              - 'frontend/**'

      # 2. Build TypeScript / artifacts if ANY service changed
      - name: Setup Node.js
        if: |
          steps.changes.outputs.weather == 'true' ||
          steps.changes.outputs.crypto == 'true' ||
          steps.changes.outputs.stock == 'true' ||
          steps.changes.outputs.news == 'true' ||
          steps.changes.outputs.auth == 'true' ||
          steps.changes.outputs.server == 'true' ||
          steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies & compile TypeScript
        if: |
          steps.changes.outputs.weather == 'true' ||
          steps.changes.outputs.crypto == 'true' ||
          steps.changes.outputs.stock == 'true' ||
          steps.changes.outputs.news == 'true' ||
          steps.changes.outputs.auth == 'true' ||
          steps.changes.outputs.server == 'true' ||
          steps.changes.outputs.frontend == 'true'
        run: |
          npm ci
          npm run build --workspaces

      # 3. Setup Docker & QEMU for ARMv7 emulation
      - name: Set up QEMU (Required for 32-bit ARM on Pi)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. CONDITIONAL BUILDS: Only runs if that specific service changed

      # --- Weather Service ---
      - name: Build & Push Weather Service
        if: steps.changes.outputs.weather == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/weather-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-weather-service:latest

      # --- Crypto Service ---
      - name: Build & Push Crypto Service
        if: steps.changes.outputs.crypto == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/crypto-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-crypto-service:latest

      # --- Stock Service ---
      - name: Build & Push Stock Service
        if: steps.changes.outputs.stock == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/stock-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-stock-service:latest

      # --- News Service ---
      - name: Build & Push News Service
        if: steps.changes.outputs.news == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/news-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-news-service:latest

      # --- Auth Service ---
      - name: Build & Push Auth Service
        if: steps.changes.outputs.auth == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/auth-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-auth-service:latest

      # --- Server (Gateway BFF) ---
      - name: Build & Push Server
        if: steps.changes.outputs.server == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-server:latest

      # --- Frontend ---
      - name: Build & Push Frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-frontend:latest
