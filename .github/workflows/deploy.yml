name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push Changed Docker Images"]
    types:
      - completed
    branches: [ main ]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Deploy on device
        run: |
          cd ${{ secrets.DEVICE_DIR }}
          git pull origin main
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
