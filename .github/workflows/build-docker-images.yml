name: Build and Push Docker Images (Manual)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select service to build and push'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - weather
          - crypto
          - stock
          - news
          - auth
          - server
          - frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies & compile TypeScript
        run: |
          npm ci
          npm run build --workspaces

      - name: Set up QEMU (Required for 32-bit ARM on Pi)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Weather Service ---
      - name: Build & Push Weather Service
        if: ${{ inputs.service == 'all' || inputs.service == 'weather' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/weather-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-weather-service:latest

      # --- Crypto Service ---
      - name: Build & Push Crypto Service
        if: ${{ inputs.service == 'all' || inputs.service == 'crypto' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/crypto-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-crypto-service:latest

      # --- Stock Service ---
      - name: Build & Push Stock Service
        if: ${{ inputs.service == 'all' || inputs.service == 'stock' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/stock-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-stock-service:latest

      # --- News Service ---
      - name: Build & Push News Service
        if: ${{ inputs.service == 'all' || inputs.service == 'news' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/news-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-news-service:latest

      # --- Auth Service ---
      - name: Build & Push Auth Service
        if: ${{ inputs.service == 'all' || inputs.service == 'auth' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/auth-service/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-auth-service:latest

      # --- Server (Gateway BFF) ---
      - name: Build & Push Server
        if: ${{ inputs.service == 'all' || inputs.service == 'server' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-server:latest

      # --- Frontend ---
      - name: Build & Push Frontend
        if: ${{ inputs.service == 'all' || inputs.service == 'frontend' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flux-platform-frontend:latest
